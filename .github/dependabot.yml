version: 2
updates:
  # App desktop (Electron + renderer)
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Scan backend (deploy lên VPS)
  - package-ecosystem: npm
    directory: '/server/adn-scan-backend'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
